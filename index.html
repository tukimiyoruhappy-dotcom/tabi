<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅のしおり</title>
<meta name="theme-color" content="#e8734a">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ============================================================
   旅のしおり — テーマ
   色は「設定」シートの テーマ色 で上書きできます
   ============================================================ */
:root{
  --accent:#e8734a;
  --accent-soft:#fdeee7;
  --bg:#faf7f2;
  --surface:#ffffff;
  --surface-2:#f4efe7;
  --line:#e6ddd0;
  --text:#2f2a25;
  --text-dim:#7d7469;
  --text-faint:#a99f92;
  --shadow:0 1px 2px rgba(60,45,30,.06), 0 6px 18px rgba(60,45,30,.07);
  --radius:16px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --accent-soft:#3a2a22;
    --bg:#17150f;
    --surface:#221f19;
    --surface-2:#2c2820;
    --line:#3a352b;
    --text:#f0eae0;
    --text-dim:#a89f91;
    --text-faint:#7d7469;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  font-size:15px;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:break-word;
}
a{color:inherit}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- 表紙ヘッダー ---------- */
.cover{
  position:relative;
  padding:26px 20px 18px;
  background:linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 65%, #8a4a8f) 100%);
  color:#fff;
  overflow:hidden;
}
.cover.has-img::before{
  content:"";position:absolute;inset:0;
  background-image:var(--cover-img);
  background-size:cover;background-position:center;
  opacity:.42;
}
.cover.has-img::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.5));
}
.cover > *{position:relative;z-index:2}
.cover .kicker{font-size:11px;letter-spacing:.22em;opacity:.85;text-transform:uppercase;margin:0 0 4px}
.cover h1{margin:0;font-size:26px;line-height:1.3;font-weight:800;letter-spacing:.01em;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.cover .sub{margin:6px 0 0;font-size:13.5px;opacity:.92}
.cover .meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
/* しおり以外のタブでは表紙を細くして、本文を広く使う */
.cover.compact{padding:13px 20px 11px}
.cover.compact h1{font-size:17px}
.cover.compact .kicker,
.cover.compact .sub,
.cover.compact .meta{display:none}
.cover .pill{
  background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(6px);
  padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;
}

/* ---------- タブ ---------- */
.tabs{
  position:sticky;top:0;z-index:60;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:0 8px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;padding:12px 13px 10px;font-size:13px;font-weight:700;
  color:var(--text-faint);border-bottom:2.5px solid transparent;white-space:nowrap;
}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- 日付ナビ ---------- */
.daynav{
  position:sticky;top:44px;z-index:55;
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:9px 14px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.daynav::-webkit-scrollbar{display:none}
.daynav[hidden]{display:none}   /* display:flex に負けないよう明示 */
.daychip{
  flex:0 0 auto;padding:5px 13px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--text-dim);
  display:flex;align-items:baseline;gap:6px;
}
.daychip b{font-size:13.5px;color:var(--text)}
.daychip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.daychip.on b{color:#fff}

main{padding:16px 14px 90px;max-width:720px;margin:0 auto}

/* ---------- 日セクション ---------- */
.day{margin:0 0 30px;scroll-margin-top:96px}
.day-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 2px}
.day-num{
  flex:0 0 auto;width:38px;height:38px;border-radius:12px;
  background:var(--accent);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;line-height:1.05;letter-spacing:.06em;
}
.day-num b{font-size:16px;letter-spacing:0}
.day-head .d-date{font-size:15px;font-weight:800;margin:0}
.day-head .d-sub{font-size:11.5px;color:var(--text-dim);margin:0}

/* ---------- 予定カード ---------- */
.leg{
  display:flex;align-items:center;gap:7px;
  margin:0 0 6px 52px;font-size:11.5px;color:var(--text-dim);font-weight:600;
}
.leg::before{content:"";width:2px;height:16px;background:var(--line);border-radius:2px;margin-left:5px}

.item{
  display:flex;gap:11px;margin-bottom:10px;position:relative;
}
.item .rail{flex:0 0 44px;text-align:right;padding-top:11px}
.item .t1{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.item .t2{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.card{
  flex:1 1 auto;min-width:0;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:12px 13px;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat,#bbb)}
.item.tentative .card{border-style:dashed;background:transparent;box-shadow:none}
.item.tentative .card .title{color:var(--text-dim)}
.item.now .card{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft), var(--shadow)}

.card .toprow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:2px}
.cat{
  font-size:10.5px;font-weight:800;padding:1.5px 8px;border-radius:999px;
  background:var(--cat-soft,#eee);color:var(--cat-ink,#555);letter-spacing:.03em;
}
.badge{font-size:10px;font-weight:800;padding:1.5px 7px;border-radius:999px;border:1px solid currentColor}
.badge.now{background:var(--accent);border-color:var(--accent);color:#fff}
.badge.tent{color:var(--text-faint)}
.card .title{font-size:15.5px;font-weight:800;line-height:1.45;margin:0}
.card .place{font-size:12.5px;color:var(--text-dim);margin:2px 0 0}
.card .want{
  font-size:12.5px;margin:7px 0 0;padding:7px 10px;border-radius:10px;
  background:var(--accent-soft);color:var(--text);font-weight:600;
}
.card .note{font-size:12.5px;color:var(--text-dim);margin:6px 0 0;white-space:pre-wrap}
.card .facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fact{font-size:11px;font-weight:700;color:var(--text-dim);background:var(--surface-2);padding:2px 9px;border-radius:8px}
.card img.photo{
  display:block;width:100%;height:auto;
  /* 読み込み前でも枠を確保しておく。遅延読み込みが確実に働きます
     （読めなかった画像はカードごと取り除くので、空枠は残りません） */
  min-height:140px;max-height:230px;object-fit:cover;
  border-radius:11px;margin-top:9px;background:var(--surface-2);
}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:800;text-decoration:none;
  padding:7px 11px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.act:active{transform:scale(.97)}

/* ---------- 汎用リスト（持ち物・お金・みんな 等） ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-bottom:14px;
}
.panel h2{margin:0 0 10px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.row{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-of-type{border-top:0}
.row .k{flex:1 1 auto;min-width:0}
.row .k b{font-size:14px;font-weight:700;display:block}
.row .k span{font-size:12px;color:var(--text-dim)}
.row .v{flex:0 0 auto;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.total b{font-size:19px}
/* 持ち物チェック（この端末だけに保存されます） */
.whobar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.whochip{
  padding:6px 14px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--text-dim);
}
.whochip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.packhead{display:flex;align-items:baseline;gap:9px;margin:0 0 3px}
.packhead h2{margin:0;flex:1 1 auto}
.packhead .count{
  font-size:12.5px;font-weight:800;color:var(--text-dim);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.packhead .count.all{color:var(--accent)}
.bar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .28s ease}
/* 小分類の見出し */
.cathead{
  display:flex;align-items:baseline;gap:8px;
  margin:16px 0 0;padding-top:13px;border-top:1px solid var(--line);
  font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--text-dim);
}
.cathead:first-of-type{margin-top:8px;padding-top:0;border-top:0}
.cathead .nm{flex:1 1 auto}
.cathead .n{
  font-style:normal;font-size:11.5px;color:var(--text-faint);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.cathead.all .nm{color:var(--accent)}
.cathead.all .n{color:var(--accent)}
.checkline{
  display:flex;align-items:center;gap:11px;padding:11px 0;
  border-top:1px solid var(--line);font-size:14.5px;
  width:100%;text-align:left;font-family:inherit;color:inherit;background:none;
}
.checkline:first-of-type,
.cathead + .checkline{border-top:0}
.checkline:active{opacity:.55}
.checkline .box{
  flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900;
  transition:background .15s, border-color .15s;
}
.checkline .lbl{flex:1 1 auto;min-width:0;line-height:1.6}
.checkline .lbl small{color:var(--text-dim);font-weight:600}
.checkline.done .box{background:var(--accent);border-color:var(--accent)}
.checkline.done .lbl{text-decoration:line-through;color:var(--text-faint)}
.checkline.done .lbl small{color:var(--text-faint);text-decoration:none}
.callout{
  background:var(--accent-soft);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:14px;
}
.callout .lbl{
  font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--accent);
  display:block;margin-bottom:2px;
}
.callout p{margin:0;font-size:14.5px;font-weight:700;line-height:1.75;white-space:pre-wrap}
.telcard{
  display:flex;align-items:center;gap:13px;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 15px;margin-bottom:14px;
}
.telcard .ic{
  flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.telcard .tx{flex:1 1 auto;min-width:0}
.telcard .tx b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.09em;color:var(--text-dim)}
.telcard .tx span{display:block;font-size:19px;font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.people{display:flex;flex-wrap:wrap;gap:9px}
.person{
  display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border-radius:999px;padding:5px 13px 5px 6px;font-size:13px;font-weight:700;
}
.person .av{
  width:29px;height:29px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
}

/* ---------- 地図 ---------- */
#map{height:calc(100dvh - 190px);min-height:320px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);z-index:1}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 11px}
.mappin{
  background:var(--accent);color:#fff;border-radius:50% 50% 50% 2px;
  width:27px;height:27px;transform:rotate(-45deg);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;
}
.mappin span{transform:rotate(45deg);font-size:12px;font-weight:900}
.leaflet-popup-content{margin:11px 13px;font-family:var(--font);min-width:170px}
.pop-t{font-size:11px;font-weight:800;color:var(--accent)}
.pop-n{font-size:14.5px;font-weight:800;margin:1px 0 3px;line-height:1.4}
.pop-p{font-size:11.5px;color:#777;margin:0 0 8px}
.pop a{display:inline-block;font-size:11.5px;font-weight:800;text-decoration:none;background:var(--accent);color:#fff;padding:5px 10px;border-radius:8px;margin:0 4px 4px 0}
.pop a.sec{background:#eceae6;color:#333}

/* ---------- 補助 ---------- */
.empty{text-align:center;color:var(--text-faint);font-size:13.5px;padding:44px 20px;line-height:2}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-size:12.5px;font-weight:700;
  padding:9px 17px;border-radius:999px;z-index:200;box-shadow:0 6px 22px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .25s, transform .25s; white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.fab{
  position:fixed;right:15px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:70;
  width:47px;height:47px;border-radius:50%;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.fab:active{transform:scale(.93)}
.foot{text-align:center;font-size:11px;color:var(--text-faint);padding:8px 20px 20px;line-height:1.9}
.foot button{text-decoration:underline;font-size:11px;color:var(--text-faint)}
.spin{animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);height:92px;margin-bottom:10px;opacity:.55;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.75}}
</style>
</head>
<body>

<header class="cover" id="cover">
  <p class="kicker" id="kicker">TRAVEL NOTE</p>
  <h1 id="ttl">旅のしおり</h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
</header>

<nav class="tabs" id="tabs" role="tablist"></nav>
<div class="daynav" id="daynav" hidden></div>

<main id="main">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</main>

<button class="fab" id="reload" title="最新に更新">↻</button>
<div class="toast" id="toast"></div>
<p class="foot" id="foot"></p>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================================
 * 旅のしおり  —  Google スプレッドシートを読むだけの静的ビューア
 *
 * 仕組み: スプレッドシートを「リンクを知っている全員が閲覧可」にすると
 *         gviz エンドポイントから JSON で読めます。ログインも API キーも不要。
 *         → 警告画面は一切出ません。
 *
 * 別の旅行に使い回す: URL の末尾に ?id=＜スプレッドシートID＞ を付けるだけ。
 *   例) https://yourname.github.io/tabi/?id=1AbC...xyz
 * ==========================================================================*/

const CONFIG = {
  // 既定のスプレッドシート（?id= を付けなかったときに開くもの）
  DEFAULT_SHEET_ID: '1s9jsBsDJjaOzlLtsrNYUDmv2moQ6YnR2bm-iAjqcmAY',
  // 読みに行くシート名。無いシートは自動的に読み飛ばします。
  SHEETS: {
    itinerary: ['行程', 'しおり', 'スケジュール', 'シート1'],
    settings:  ['設定'],
    members:   ['メンバー'],
    packing:   ['持ち物'],
    budget:    ['費用', '予算'],
    stay:      ['宿泊'],
    transport: ['交通'],
    candidates:['候補', '候補地'],
    info:      ['基本情報', 'ルール', 'メモ'],
  },
};

/* --------------------------------- 列の別名 ------------------------------- */
const ALIAS = {
  date:     ['日にち','日付','日','date'],
  start:    ['時間','開始','開始時間','時刻','start','time'],
  end:      ['終了時間','終了','おわり','end'],
  cat:      ['カテゴリ','区分','種別','category'],
  name:     ['名称','タイトル','予定','name','title'],
  place:    ['場所','住所','スポット','place','address'],
  latlng:   ['緯度経度','座標','latlng'],
  move:     ['移動手段','交通手段','交通','移動','transport'],
  dur:      ['所要','所要時間','移動時間','duration'],
  cost:     ['費用','金額','予算','cost'],
  url:      ['参考hp','参考','リンク','url','hp','ホームページ'],
  photo:    ['写真','画像','photo','image'],
  map:      ['マップ','地図','map'],
  file:     ['ファイル','資料','file'],
  rating:   ['評価','おすすめ度','rating'],
  want:     ['やりたいこと','目的','ハイライト','ねらい'],
  note:     ['備考','メモ','note','コメント'],
  booking:  ['予約番号','予約','booking','確認番号'],
  tel:      ['電話','tel','電話番号'],
  status:   ['状態','ステータス','status','確定'],
  show:     ['表示','show'],
};

/* ------------------------------ カテゴリ定義 ------------------------------ */
const CATS = {
  '移動':   {e:'🚃', c:'#5b8def', s:'#e8effd', i:'#2c5bbf'},
  '観光':   {e:'🏞️', c:'#3fae7a', s:'#e4f5ec', i:'#237a52'},
  '食事':   {e:'🍽️', c:'#e8734a', s:'#fdece5', i:'#b34a24'},
  '宿泊':   {e:'🏨', c:'#8a6fd4', s:'#eee9fb', i:'#5b41a8'},
  '買い物': {e:'🛍️', c:'#e0577f', s:'#fce7ee', i:'#b02b55'},
  '体験':   {e:'🎫', c:'#d99b25', s:'#fbf0dc', i:'#96690d'},
  '温泉':   {e:'♨️', c:'#e0577f', s:'#fce7ee', i:'#b02b55'},
  '集合':   {e:'📣', c:'#4aa8b8', s:'#e2f3f6', i:'#1f6d7a'},
  '自由':   {e:'🕊️', c:'#9aa0a6', s:'#eeefF1', i:'#5f6368'},
};

const $  = s => document.querySelector(s);
const el = (t, cls, html) => { const n=document.createElement(t); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
const esc = s => String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s??'').trim().toLowerCase().replace(/[\s　_-]/g,'');

/* ------------------------- スプレッドシートを読む ------------------------- */
const SHEET_ID = new URLSearchParams(location.search).get('id') || CONFIG.DEFAULT_SHEET_ID;
const CACHE_KEY = 'tabi:' + SHEET_ID;

// name を省略すると「いちばん左のシート」を読みます
async function fetchTable(name){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
            + `?tqx=out:json&headers=1`
            + (name ? `&sheet=${encodeURIComponent(name)}` : '');
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const txt = await res.text();
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if(a < 0) throw new Error('bad response');
  const json = JSON.parse(txt.slice(a, b + 1));
  if(json.status === 'error') throw new Error('sheet not found');
  return {
    sig:   String(json.sig || ''),
    heads: (json.table.cols || []).map(c => String(c.label || '').trim()).filter(Boolean),
    rows:  gvizToRows(json.table),
  };
}

// gviz のテーブルを [{列名: {v, f}}] の配列にする
function gvizToRows(table){
  const heads = (table.cols||[]).map((c,i) => String(c.label||'').trim() || `col${i}`);
  return (table.rows||[]).map(r => {
    const o = {__raw:{}};
    heads.forEach((h,i) => {
      const cell = (r.c||[])[i];
      o[h] = cellText(cell);
      o.__raw[h] = cell ? cell.v : null;
    });
    return o;
  }).filter(o => heads.some(h => o[h] !== ''));
}

// セルを表示用の文字列に。日付/時刻は書式付きの値を優先。
function cellText(cell){
  if(!cell) return '';
  if(cell.f != null && cell.f !== '') return String(cell.f).trim();
  const v = cell.v;
  if(v == null) return '';
  if(typeof v === 'string' && v.startsWith('Date(')){
    const p = v.slice(5,-1).split(',').map(Number);
    if(p.length >= 3 && p[0] > 1900) return `${p[0]}/${p[1]+1}/${p[2]}`;
    return `${String(p[3]||0).padStart(2,'0')}:${String(p[4]||0).padStart(2,'0')}`;
  }
  if(typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  return String(v).trim();
}

// 別名リストから列を引く
function pick(row, key){
  const wants = ALIAS[key] || [];
  for(const k of Object.keys(row)){
    if(k === '__raw') continue;
    if(wants.includes(norm(k))) return row[k];
  }
  return '';
}

/* シートを役割ごとに読み分ける。
 *
 * 注意: Google は「存在しないシート名」を指定されてもエラーにせず、
 * いちばん左のシートを返してきます。そのままだと、まだ作っていない
 * 「持ち物」などに行程の中身が入り込んでしまいます。
 * そこで先にダミー名で問い合わせて既定シートの署名(sig)を控えておき、
 * 同じ署名が返ってきたものは「そのシートは無い」と判断します。
 */
const ROLE_ORDER = ['itinerary','settings','members','packing','budget','stay','transport','candidates','info'];

/* 既定シートが「どの役割のシートなのか」を、見出しの顔ぶれから見分けるための特徴。
 * すべての組がそろって初めて一致とみなします。 */
const SHEET_SHAPE = {
  itinerary:  [['日にち','日付','日','date'], ['名称','タイトル','予定','name','title']],
  settings:   [['項目','キー','設定','item'], ['値','value']],
  members:    [['名前','氏名','name','メンバー']],
  packing:    [['品名','持ち物','品目']],
  budget:     [['項目','名称','内容'], ['金額','費用','予算','cost']],
  stay:       [['施設名','宿','ホテル','宿泊先']],
  transport:  [['便名','種別','列車']],
  candidates: [['名称','候補','スポット','名前'], ['優先度','おすすめ度','エリア']],
  info:       [['項目'], ['内容','説明']],
};
function shapeScore(role, heads){
  const groups = SHEET_SHAPE[role] || [];
  const hs = heads.map(norm);
  if(!groups.length) return 0;
  return groups.every(g => g.some(w => hs.includes(norm(w)))) ? groups.length : 0;
}

async function loadAllSheets(){
  let fallback = null;
  try { fallback = await fetchTable('__tabi_probe__' + Date.now()); } catch(e){}
  const fallbackSig = fallback ? fallback.sig : null;

  const found = {};
  await Promise.all(ROLE_ORDER.map(async role => {
    for(const name of CONFIG.SHEETS[role]){
      let t;
      try { t = await fetchTable(name); } catch(e){ continue; }
      if(fallbackSig && t.sig === fallbackSig) continue;   // そのシートは存在しない
      found[role] = t.rows;
      return;
    }
  }));

  /* 既定シートの引き取り先を、見出しの形から決める。
   * 使っていない古いシートが左端に残っていても、
   * 見出しが合わなければどの役割にも入り込みません。 */
  if(fallback){
    let best = null, bestScore = 0;
    for(const role of ROLE_ORDER){
      if(found[role]) continue;
      const sc = shapeScore(role, fallback.heads);
      if(sc > bestScore){ bestScore = sc; best = role; }
    }
    if(!best && !found.itinerary) best = 'itinerary';   // 見分けがつかないときの受け皿
    if(best) found[best] = fallback.rows;
  }
  return found;
}

/* ------------------------------ データ整形 -------------------------------- */
// 日本語入力で入りがちな全角の数字・記号を半角に直す
function toHalf(s){
  return String(s ?? '')
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[：]/g, ':')
    .replace(/[／]/g, '/')
    .replace(/[－ー―]/g, '-')
    .trim();
}

/* 並び順は 実際の日付 → 「N日目」 → その他の文字 → 空欄 の順。
 * 日付がまだ決まっていなくても、書いた分だけ形になります。 */
function parseDateKey(s){
  const t = toHalf(s);
  if(!t) return {key:'', sort:'D', label:'日付未定', short:'未定', wd:''};

  const m = t.match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/)
         || t.match(/^(\d{1,2})[\/\-月.](\d{1,2})/);
  let y, mo, d;
  if(m && m.length === 4){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if(m){ y=new Date().getFullYear(); mo=+m[1]; d=+m[2]; }
  if(y){
    const dt = new Date(y, mo-1, d);
    const wd = '日月火水木金土'[dt.getDay()];
    return {
      key: `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
      sort: 'A' + `${y}${String(mo).padStart(2,'0')}${String(d).padStart(2,'0')}`,
      label: `${mo}月${d}日`, short:`${mo}/${d}`, wd, date: dt,
    };
  }

  // 「1日目」「2日目」— 日程がまだ確定していないとき用
  const nth = t.match(/^(\d{1,3})\s*日目/);
  if(nth){
    return {
      key: 'nth' + nth[1],
      sort: 'B' + String(nth[1]).padStart(3, '0'),
      label: `${nth[1]}日目`, short:`${nth[1]}日目`, wd:'',
    };
  }

  return {key:t, sort:'C'+t, label:t, short:t, wd:''};
}

function parseTime(s){
  const t = toHalf(s);
  const m = t.match(/(\d{1,2})\s*[:時]\s*(\d{1,2})?/);
  if(!m) return null;
  let h = +m[1];
  const mi = +(m[2] || 0);
  // 午後7時 を 19:00 として扱う（12時間表記のとりこぼし防止）
  if(/午後|ごご|PM|P\.M\./i.test(t) && h < 12) h += 12;
  if(/午前|ごぜん|AM|A\.M\./i.test(t) && h === 12) h = 0;
  return {h, m:mi, text:`${h}:${String(mi).padStart(2,'0')}`, mins:h*60 + mi};
}

function isTentative(status){
  const s = String(status||'').trim();
  return /候補|未定|仮|検討|maybe|tbd/i.test(s);
}
function isHidden(row){
  const v = String(pick(row,'show')||'').trim().toUpperCase();
  return v === 'FALSE' || v === '×' || v === '非表示' || v === 'NO';
}

function buildItinerary(rows){
  const items = [];
  (rows||[]).forEach((r, idx) => {
    if(isHidden(r)) return;
    const name = pick(r,'name');
    const dateRaw = pick(r,'date');
    if(!name && !dateRaw) return;
    const d = parseDateKey(dateRaw);
    const t = parseTime(pick(r,'start'));
    items.push({
      idx, d, t,
      end:      parseTime(pick(r,'end')),
      cat:      pick(r,'cat'),
      name:     name || '(名称未定)',
      place:    pick(r,'place'),
      latlng:   pick(r,'latlng'),
      move:     pick(r,'move'),
      dur:      pick(r,'dur'),
      cost:     pick(r,'cost'),
      url:      pick(r,'url'),
      photo:    pick(r,'photo'),
      map:      pick(r,'map'),
      file:     pick(r,'file'),
      rating:   pick(r,'rating'),
      want:     pick(r,'want'),
      note:     pick(r,'note'),
      booking:  pick(r,'booking'),
      tel:      pick(r,'tel'),
      status:   pick(r,'status'),
    });
  });

  // 日付 → 時刻 → 入力順 で並べる
  items.sort((a,b) =>
    a.d.sort.localeCompare(b.d.sort)
    || (a.t?.mins ?? 99999) - (b.t?.mins ?? 99999)
    || a.idx - b.idx
  );

  const days = [];
  const byKey = new Map();
  items.forEach(it => {
    if(!byKey.has(it.d.key)){
      const day = {...it.d, items:[]};
      byKey.set(it.d.key, day);
      days.push(day);
    }
    byKey.get(it.d.key).items.push(it);
  });
  days.forEach((d,i) => d.n = i + 1);
  return days;
}

/* ------------------------- Google マップ用のURL --------------------------- */
function target(it){
  return String(it.place || it.name || '').trim();
}

// Googleマップの共有リンクかどうか
const isMapUrl = u =>
  /^https?:\/\//i.test(u || '') && /maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps/i.test(u);

/* マップ列に貼るのが本来ですが、写真や参考HPの列に入っていても拾います。
 * 列を取り違えても、押せば目的の場所が開くように。 */
function mapLinkOf(it){
  return [it.map, it.photo, it.url].find(isMapUrl) || '';
}

/* 場所が分かっている予定かどうか。
 * 「帰る」「就寝」のように行き先のない予定に、地図ボタンを出さないための判定です。
 * 場所・マップ・緯度経度 のどれかが入っていれば対象になります。 */
function hasLocation(it){
  return !!(String(it.place || '').trim() || mapLinkOf(it) || String(it.latlng || '').trim());
}

function gmapSearch(it){
  const pinned = mapLinkOf(it);
  if(pinned) return pinned;                                  // 貼られたリンクを優先
  const ll = coordsOf(it);
  if(ll) return `https://www.google.com/maps/search/?api=1&query=${ll[0]},${ll[1]}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target(it))}`;
}
function gmapRoute(it){
  const ll = coordsOf(it);
  const dest = ll ? `${ll[0]},${ll[1]}` : target(it);
  const mode = TRAVELMODE[String(it.move||'').trim()] || 'transit';
  // origin を省略すると Google マップ側が「現在地」を使ってくれます
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=${mode}`;
}
function gmapNearby(it, kw){
  const ll = coordsOf(it);
  if(ll) return `https://www.google.com/maps/search/${encodeURIComponent(kw)}/@${ll[0]},${ll[1]},15z`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target(it) + ' ' + kw)}`;
}
// その日の全地点を1本のルートにして Google マップで開く
function gmapDayRoute(day){
  const pts = day.items.filter(hasLocation).map(target).filter(Boolean);
  if(pts.length < 2) return null;
  const origin = pts[0], dest = pts[pts.length-1];
  const way = pts.slice(1,-1).slice(0,8);   // Google の無料URLは経由地9件程度が上限
  let u = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}`;
  if(way.length) u += `&waypoints=${way.map(encodeURIComponent).join('|')}`;
  return u + '&travelmode=driving';
}
// Google ドライブの共有リンクを画像URLに変換
// Googleドライブの共有リンクからファイルIDを取り出す
function driveId(u){
  const m = String(u||'').match(
    /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=|thumbnail\?id=|.*[?&]id=)([\w-]{20,})/);
  return m ? m[1] : '';
}

function imgUrl(u){
  const s = String(u||'').trim();
  if(!/^https?:\/\//i.test(s)) return '';
  // Googleマップ／Googleフォトの共有リンクは画像ではないので、画像としては使わない
  if(isMapUrl(s) || /photos\.app\.goo\.gl|photos\.google\.com/i.test(s)) return '';
  const id = driveId(s);
  if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w1200`;
  return s;
}

/* ドライブの thumbnail は、1ページに画像が多いと読み込みを断られることがあります。
 * そのときのための、もう一つの入口。 */
function imgUrlAlt(u){
  const id = driveId(u);
  return id ? `https://drive.google.com/uc?export=view&id=${id}` : '';
}
/* 緯度経度を取り出す。数字を並べたものはもちろん、
 * 座標を含んだGoogleマップのURLを貼っても読み取れます。 */
function coordsOf(it){
  for(const src of [it.latlng, it.map]){
    const m = String(src || '').match(/(-?\d{1,3}\.\d{3,})\s*[,、\s]\s*(-?\d{1,3}\.\d{3,})/);
    if(m){
      const la = parseFloat(m[1]), ln = parseFloat(m[2]);
      if(Math.abs(la) <= 90 && Math.abs(ln) <= 180) return [la, ln];
    }
  }
  if(it._geo) return it._geo;
  return null;
}

  if((d.packing||[]).length)    tabs.push(['pack','🎒 持ち物', true]);
  if((d.budget||[]).length || d.days.some(x=>x.items.some(i=>i.cost))) tabs.push(['money','💰 お金', true]);
  if((d.stay||[]).length || (d.transport||[]).length) tabs.push(['book','🎫 予約', true]);

function itemCard(it, prev, isNow){

  const card = el('div','card');

  card.appendChild(el('div','title', esc(it.name)));
  if(it.place) card.appendChild(el('div','place', '📍 ' + esc(it.place)));
  if(it.want)  card.appendChild(el('div','want', '✨ ' + esc(it.want)));
  if(it.note)  card.appendChild(el('div','note', esc(it.note)));

  const facts = el('div','facts');
  if(it.cost)    facts.appendChild(el('span','fact', '💴 ' + esc(it.cost)));

  if(it.tel)     facts.appendChild(el('span','fact', '☎️ ' + esc(it.tel)));
  if(facts.children.length) card.appendChild(facts);

  const photo = imgUrl(it.photo);
  if(photo){
    const im = el('img','photo');
    im.alt = it.name; im.loading = 'lazy';
    let retried = false;
    im.onerror = () => {              // onerror は src より先に付けておく
      const alt = imgUrlAlt(it.photo);
      if(!retried && alt){ retried = true; im.src = alt; return; }
      im.remove();                    // それでも読めなければ静かに消す
    };
    im.src = photo;
    card.appendChild(im);
  }

  const acts = el('div','acts');
  const add = (href, cls, label) => {
    const a = el('a','act' + (cls ? ' ' + cls : ''), label);
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    acts.appendChild(a);
  };
  if(hasLocation(it)){
    add(gmapRoute(it), 'primary', '🧭 ここへ行く');
    add(gmapSearch(it), '', '🗺 地図');
    add(gmapNearby(it, '観光'), '', '👀 周辺');
  }
  if(/^https?:\/\//i.test(it.url))  add(it.url, '', '🔗 参考ページ');
  if(/^https?:\/\//i.test(it.file)) add(it.file, '', '📎 資料');
  if(it.tel) add('tel:' + String(it.tel).replace(/[^\d+]/g,''), '', '☎️ 電話');
  if(acts.children.length) card.appendChild(acts);

  wrap.appendChild(card);

  // 「ここへ来るまでの移動」を前のカードとの間に差し込む
  if(it.move || it.dur){
    const ic = MOVE_ICON[String(it.move||'').trim()] || '➡️';
    const parts = [it.move, it.dur].filter(Boolean).map(esc).join(' ・ ');
    const leg = el('div','leg', `${ic} ${parts}`);
    return [leg, wrap];
  }
  return [wrap];
}

/* --- 住所・地名から座標を求める（OpenStreetMap の無料サービス・キー不要） ---
 * 同じ地名は全国にあるので、「設定」シートの エリア を基準にして
 * その周辺を優先して探します。見つからなければ範囲を広げて再挑戦。 */
const GEO_KEY = 'tabi:geo';
const geoCache = JSON.parse(localStorage.getItem(GEO_KEY) || '{}');
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function nominatim(q, near){
  let u = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q=${encodeURIComponent(q)}`;
  if(near){
    const d = 0.9;   // 基準地点から およそ100km 四方
    u += `&viewbox=${near[1]-d},${near[0]+d},${near[1]+d},${near[0]-d}&bounded=1`;
  }
  try{
    const r = await fetch(u);
    if(!r.ok) return null;
    const j = await r.json();
    if(j && j[0]) return [parseFloat(j[0].lat), parseFloat(j[0].lon)];
  }catch(e){ /* オフライン等 */ }
  return null;
}

/* 検索に使う語を、当たりやすい順に組み立てる。
 *
 * 「場所」が書いてあれば、それだけを手がかりにします。
 * 名称まで検索語に混ぜると、たとえば「起床」のような予定名が
 * 遠くの無関係な場所にヒットしてしまうためです。 */
function geoQueries(it, area){
  const place = String(it.place || '').trim();
  const name  = String(it.name || '').split(/[→⇒~〜]/)[0].trim();
  const base  = place || name;
  if(!base) return [];

  const out = [];
  const hasAddr = /[都道府県市区町村]/.test(base);
  if(area && !hasAddr) out.push(`${area} ${base}`);
  out.push(base);
  const noBanchi = base.replace(/[\d０-９]+[-−ー－‐][\d０-９-−ー－‐]*\s*$/, '').trim();
  if(noBanchi && noBanchi !== base) out.push(noBanchi);
  return [...new Set(out.filter(Boolean))];
}

async function geocode(queries, near){
  const list = (queries || []).filter(Boolean);
  if(!list.length) return null;
  const key = (near ? near.map(n => n.toFixed(1)).join(',') : 'any') + '|' + list.join('|');
  if(key in geoCache) return geoCache[key];

  const passes = near ? [near, null] : [null];
  for(const anchor of passes){
    for(const q of list){
      const hit = await nominatim(q, anchor);
      if(hit){
        geoCache[key] = hit;
        localStorage.setItem(GEO_KEY, JSON.stringify(geoCache));
        return hit;
      }
      await sleep(1100);   // OpenStreetMap への配慮（1秒に1回まで）
    }
  }
  geoCache[key] = null;    // 失敗も覚えておき、毎回問い合わせないようにする
  localStorage.setItem(GEO_KEY, JSON.stringify(geoCache));
  return null;
}

// 旅行エリアの中心を決める（明示的な緯度経度 → 設定のエリア の順）
async function resolveAnchor(){
  if(STATE.anchor !== undefined) return STATE.anchor;
  const s = STATE.data.settings || {};
  const area = String(s['エリア'] || s['地域'] || s['行き先'] || '').trim();
  STATE.area = area;
  for(const d of STATE.data.days){
    for(const it of d.items){
      const m = String(it.latlng || '').match(/(-?\d+\.\d+)\s*[,、]\s*(-?\d+\.\d+)/);
      if(m){ STATE.anchor = [parseFloat(m[1]), parseFloat(m[2])]; return STATE.anchor; }
    }
  }
  STATE.anchor = area ? await nominatim(area, null) : null;
  return STATE.anchor;
}

function firstOf(row, keys){
  for(const k of Object.keys(row)){
    if(k === '__raw') continue;
    if(keys.some(w => norm(k) === norm(w))) return row[k];
  }
  return '';
}
function allKeys(row){ return Object.keys(row).filter(k => k !== '__raw'); }

/* ===== 持ち物チェック =====
 * チェックの状態は、その端末のブラウザだけに保存します（localStorage）。
 * スプレッドシートには書き戻さないので、家族それぞれが自分の端末で
 * 自由にチェックでき、他の人の画面には影響しません。 */
const CHECK_KEY = 'tabi:check:' + SHEET_ID;
const WHO_KEY   = 'tabi:who:'   + SHEET_ID;

function loadChecks(){
  try { return JSON.parse(localStorage.getItem(CHECK_KEY) || '{}'); } catch(e){ return {}; }
}
function saveChecks(o){
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(o)); } catch(e){}
}

/* 担当ごとにまとめる。
 *
 * 持ち物シートの「グループ」列に大きなくくり（例: 大久保家 / 吉野家）を、
 * 「共通」列に共有のくくり（例: 両方）の名前を書いておくと、
 * 共通に入れた品物が各グループのリストへ配られます。
 * それ以外の担当（子どもの名前など）は、その人だけのリストになり、
 * 共通の品物は入りません。
 *
 * 名前を変えたいときは、この2つの列を書き換えるだけです。 */
/* 小分類のアイコン。分類名に含まれる言葉で選ぶので、
 * 別の旅行で分類名を変えてもだいたい合います。 */
const PACK_ICONS = [
  [/貴重|現金|お金|財布|証明|チケット|移動|切符/, '🎫'],
  [/電子|機器|娯楽|ゲーム|充電|カメラ/,           '🔌'],
  [/衣類|服|着替|下着|パジャマ/,                  '👕'],
  [/洗面|身だしなみ|化粧|メイク|洗顔|歯/,         '🪥'],
  [/暑さ|寒さ|天候|防寒|日焼|雨|傘|虫/,           '☀️'],
  [/薬|医療|救急|衛生/,                           '💊'],
  [/飲食|食べ|飲み|おやつ|軽食/,                  '🍫'],
  [/子ども|こども|キッズ|赤ちゃん/,               '🧸'],
  [/書類|予約|保険/,                              '📄'],
];
function packIcon(name){
  const hit = PACK_ICONS.find(([re]) => re.test(String(name || '')));
  return hit ? hit[1] : '📦';
}

// 小分類の並び順は、シートに書いてある順をそのまま使う
function packingCategories(rows){
  const order = [];
  rows.forEach(r => {
    const c = String(firstOf(r, ['分類','カテゴリ','種別','区分','category'])).trim();
    if(c && !order.includes(c)) order.push(c);
  });
  return order;
}

function packingConfig(rows){
  const groupNames = [], sharedNames = [];
  rows.forEach(r => {
    const g = String(firstOf(r, ['グループ','家族','くくり','group'])).trim();
    if(g && !groupNames.includes(g)) groupNames.push(g);
    const s = String(firstOf(r, ['共通','全員共通','共有','shared'])).trim();
    if(s && !sharedNames.includes(s)) sharedNames.push(s);
  });
  return { groupNames, sharedNames };
}

function packingGroups(){
  const rows = STATE.data.packing || [];
  const { groupNames, sharedNames } = packingConfig(rows);

  const seen = new Map(), groups = new Map();
  groupNames.forEach(g => groups.set(g, []));   // 設定した順に並べる

  const push = (bucket, item) => {
    if(!groups.has(bucket)) groups.set(bucket, []);
    const base = `${bucket}|${item.name}`;
    const n = (seen.get(base) || 0) + 1;
    seen.set(base, n);
    groups.get(bucket).push({ ...item, id: n > 1 ? `${base}#${n}` : base });
  };

  rows.forEach(r => {
    const name = firstOf(r, ['品名','持ち物','品目','item','名称']);
    if(!name) return;
    const who  = String(firstOf(r, ['担当','だれ','who','担当者','持つ人'])).trim() || 'みんな';
    const item = {
      name,
      cat:  String(firstOf(r, ['分類','カテゴリ','種別','区分','category'])).trim(),
      num:  firstOf(r, ['個数','数','qty']),
      note: firstOf(r, ['備考','メモ','note']),
    };

    if(groupNames.length && sharedNames.includes(who)){
      groupNames.forEach(g => push(g, item));   // 共通は各グループへ配る
    }else{
      push(who, item);                          // グループ本人・個人はそのまま
    }
  });

  [...groups.keys()].forEach(k => { if(!groups.get(k).length) groups.delete(k); });
  return groups;
}

function viewPack(){
  const main = $('#main'); main.innerHTML = '';
  const groups = packingGroups();
  if(!groups.size){
    main.appendChild(el('div','empty',
      `<span class="big">🎒</span>「持ち物」シートに<br>品名と担当を書くと、ここに並びます。`));
    return;
  }
  const checks = loadChecks();
  const people = [...groups.keys()];

  // 誰のぶんを見るか（選んだ人は端末に記憶します）
  if(people.length > 1){
    const bar = el('div','whobar');
    const chip = (label, val) => {
      const b = el('button','whochip' + (STATE.who === val ? ' on' : ''), esc(label));
      b.onclick = () => {
        STATE.who = val;
        try { val ? localStorage.setItem(WHO_KEY, val) : localStorage.removeItem(WHO_KEY); } catch(e){}
        viewPack();
      };
      bar.appendChild(b);
    };
    chip('全員', null);
    people.forEach(p => chip(p, p));
    main.appendChild(bar);
  }

  const catOrder = packingCategories(STATE.data.packing || []);

  people.filter(p => !STATE.who || STATE.who === p).forEach(who => {
    const items = groups.get(who);
    const p = el('div','panel');

    const head = el('div','packhead');
    head.appendChild(el('h2', null, `🎒 ${esc(who)}`));
    const count = el('div','count');
    head.appendChild(count);
    p.appendChild(head);

    const bar = el('div','bar');
    const fill = el('i');
    bar.appendChild(fill);
    p.appendChild(bar);

    const updaters = [];
    const refresh = () => {
      const done = items.filter(i => checks[i.id]).length;
      count.textContent = `${done} / ${items.length}`;
      count.classList.toggle('all', done === items.length);
      fill.style.width = Math.round(done / items.length * 100) + '%';
      updaters.forEach(f => f());
    };

    const makeLine = item => {
      const line = el('button','checkline' + (checks[item.id] ? ' done' : ''));
      line.type = 'button';
      const box = el('div','box', checks[item.id] ? '✓' : '');
      line.appendChild(box);
      line.appendChild(el('span','lbl',
        `${esc(item.name)}`
        + (item.num  ? ` <small>×${esc(item.num)}</small>` : '')
        + (item.note ? `<br><small>${esc(item.note)}</small>` : '')));
      line.onclick = () => {
        if(checks[item.id]) delete checks[item.id];
        else checks[item.id] = true;
        saveChecks(checks);
        line.classList.toggle('done', !!checks[item.id]);
        box.textContent = checks[item.id] ? '✓' : '';
        refresh();
      };
      return line;
    };

    if(catOrder.length){
      // 小分類ごとにまとめる。シートに書いてある順に並べ、分類なしは最後
      const byCat = new Map();
      items.forEach(i => {
        const c = i.cat || 'その他';
        if(!byCat.has(c)) byCat.set(c, []);
        byCat.get(c).push(i);
      });
      const rank = c => { const i = catOrder.indexOf(c); return i < 0 ? 9999 : i; };
      [...byCat.keys()].sort((a,b) => rank(a) - rank(b)).forEach(c => {
        const list = byCat.get(c);
        const ch = el('div','cathead');
        ch.appendChild(el('span','nm', `${packIcon(c)} ${esc(c)}`));
        const n = el('span','n');
        ch.appendChild(n);
        p.appendChild(ch);
        updaters.push(() => {
          const d = list.filter(i => checks[i.id]).length;
          n.textContent = `${d}/${list.length}`;
          ch.classList.toggle('all', d === list.length);
        });
        list.forEach(item => p.appendChild(makeLine(item)));
      });
    }else{
      items.forEach(item => p.appendChild(makeLine(item)));
    }

    refresh();
    main.appendChild(p);
  });

  const note = el('p','foot',
    'チェックはこの端末にだけ保存されます。ほかの人の画面は変わりません。<br>');
  const reset = el('button', null, 'この端末のチェックを全部消す');
  reset.onclick = () => {
    if(!confirm('チェックを全部外します。よろしいですか？')) return;
    saveChecks({});
    viewPack();
    toast('チェックを消しました');
  };
  note.appendChild(reset);
  main.appendChild(note);
}

    rows.forEach(r => {
      const nm = firstOf(r, ['項目','名称','内容','item']);
      if(!nm) return;
      const amt = firstOf(r, ['金額','費用','予算','cost']);
      const who = firstOf(r, ['支払','支払者','担当','who']);
      total += parseFloat(String(amt).replace(/[^\d.]/g,'')) || 0;
      const row = el('div','row');
      row.appendChild(el('div','k', `<b>${esc(nm)}</b>${who ? `<span>${esc(who)}</span>` : ''}`));
      row.appendChild(el('div','v', esc(amt)));
      p.appendChild(row);
    });
    const t = el('div','total');
    t.appendChild(el('span', null, '合計'));
    t.appendChild(el('b', null, '¥' + total.toLocaleString()));
    p.appendChild(t);
    main.appendChild(p);
  }
  // 行程シートの費用も日別に集計
  const days = STATE.data.days.filter(d => d.items.some(i => i.cost));
  if(days.length){
    const p = el('div','panel');
    p.appendChild(el('h2', null, '🗒 行程に入っている費用'));
    let sum = 0;
    days.forEach(d => {
      const c = d.items.reduce((s,x) => s + (parseFloat(String(x.cost).replace(/[^\d.]/g,'')) || 0), 0);
      sum += c;
      const row = el('div','row');
      row.appendChild(el('div','k', `<b>${esc(d.label)}</b><span>${d.items.length}件</span>`));
      row.appendChild(el('div','v', '¥' + c.toLocaleString()));
      p.appendChild(row);
    });
    const t = el('div','total');
    t.appendChild(el('span', null, '小計'));
    t.appendChild(el('b', null, '¥' + sum.toLocaleString()));
    p.appendChild(t);
    main.appendChild(p);
  }
  const n = (STATE.data.members||[]).length;
  if(n && total){
    main.appendChild(el('p','foot', `メンバー${n}人で割ると、ひとり約 ¥${Math.round(total/n).toLocaleString()} です。`));
  }
}

function viewBook(){
  const main = $('#main'); main.innerHTML = '';
  const stay = STATE.data.stay || [];
  const tr = STATE.data.transport || [];
  if(stay.length) main.appendChild(simpleTable(stay, {
    title:'🏨 宿泊',
    main:['施設名','宿','名称','ホテル'],
    sub:['日付','チェックイン','チェックアウト','住所','電話','予約番号'],
    right:['金額','料金'], link:['url','リンク','参考hp','hp'],
  }));
  if(tr.length) main.appendChild(simpleTable(tr, {
    title:'🎫 交通・チケット',
    main:['便名','名称','種別','列車','内容'],
    sub:['出発','出発地','出発時刻','到着','到着地','到着時刻','座席','予約番号'],
    right:['金額','料金'], link:['url','リンク','参考hp','hp'],
  }));
  if(!stay.length && !tr.length) main.appendChild(el('div','empty','<span class="big">🎫</span>「宿泊」「交通」シートを作ると、ここに出ます。'));
}

function viewIdea(){
  const main = $('#main'); main.innerHTML = '';
  const rows = STATE.data.candidates || [];
  main.appendChild(el('p','foot','まだ予定に入れていない行き先の候補です。決まったら「行程」シートへ移してください。'));
  const p = el('div','panel');
  p.appendChild(el('h2', null, '💡 行き先の候補'));
  rows.forEach(r => {
    const nm = firstOf(r, ['名称','候補','スポット','名前','name']);
    if(!nm) return;
    const cat = firstOf(r, ['カテゴリ','区分','種別']);
    const area = firstOf(r, ['エリア','地域','場所']);
    const dur = firstOf(r, ['所要','所要時間','滞在']);
    const pr = firstOf(r, ['優先度','おすすめ度','評価']);
    const url = firstOf(r, ['url','参考hp','リンク','hp']);
    const note = firstOf(r, ['備考','メモ','コメント']);
    const c = catOf(cat);
    const row = el('div','row');
    row.appendChild(el('div','k',
      `<b>${c.e} ${esc(nm)}</b><span>${[area, dur, note].filter(Boolean).map(esc).join(' ・ ')}</span>`));
    if(pr) row.appendChild(el('div','v', esc(pr)));
    const acts = el('div','acts'); acts.style.marginTop = '0';
    const a1 = el('a','act','🗺');
    a1.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((area ? area + ' ' : '') + nm)}`;
    a1.target='_blank'; a1.rel='noopener'; acts.appendChild(a1);
    if(/^https?:\/\//i.test(url)){
      const a2 = el('a','act','🔗'); a2.href = url; a2.target='_blank'; a2.rel='noopener'; acts.appendChild(a2);
    }
    row.appendChild(acts);
    p.appendChild(row);
  });
  main.appendChild(p);
}

/* 「設定」シートのうち、表紙や動作の指定に使ったもの以外を情報タブに出す */
const SETTING_USED = ['タイトル','サブタイトル','テーマ色','表紙画像','カバー画像','英字見出し','ひとこと','エリア','地域','行き先'];
const RE_TEL  = /電話|連絡先|tel/i;
const RE_RULE = /おやくそく|お約束|約束|やくそく|ルール|きまり|決まり/;
// 090-0000-0000 のような区切りつきでも拾えるよう、数字の個数で見る
const isPhone = (k, v) => RE_TEL.test(k) && String(v).replace(/\D/g, '').length >= 6;
// 「泊まる場所」「集合場所」など、地図で開きたくなる項目
const RE_PLACE = /場所|ホテル|旅館|宿|泊|会場|集合|拠点|駅|空港|現地/;
const isPlace = (k, v) => RE_PLACE.test(k) && v && !/^https?:\/\//i.test(v);

// 地名が短いときだけ、エリアを補って検索精度を上げる
function placeQuery(v){
  const area = (STATE.data.settings || {})['エリア'] || '';
  const hasAddr = /[都道府県市区町村]/.test(v);
  return (area && !hasAddr) ? `${area} ${v}` : v;
}
function settingsExtras(){
  return Object.entries((STATE.data && STATE.data.settings) || {})
    .filter(([k, v]) => String(v).trim() && !SETTING_USED.includes(k));
}

function viewInfo(){
  const main = $('#main'); main.innerHTML = '';
  const extras = settingsExtras();

  // 連絡先は、押せばそのままかけられる形で目立たせる
  extras.filter(([k, v]) => isPhone(k, v)).forEach(([k, v]) => {
    const a = el('a','telcard');
    a.href = 'tel:' + String(v).replace(/[^\d+]/g, '');
    a.innerHTML = `<div class="ic">📞</div><div class="tx"><b>${esc(k)}</b><span>${esc(v)}</span></div>`;
    main.appendChild(a);
  });

  // おやくそくは いちばん上に大きく
  extras.filter(([k]) => RE_RULE.test(k)).forEach(([k, v]) => {
    main.appendChild(el('div','callout', `<span class="lbl">${esc(k)}</span><p>${esc(v)}</p>`));
  });

  const mem = STATE.data.members || [];
  if(mem.length){
    const p = el('div','panel');
    p.appendChild(el('h2', null, '👥 メンバー'));
    const box = el('div','people');
    mem.forEach(r => {
      const nm = firstOf(r, ['名前','氏名','name','メンバー']);
      if(!nm) return;
      const ic = firstOf(r, ['アイコン','絵文字','emoji']) || nm.slice(0,1);
      const role = firstOf(r, ['役割','担当','role']);
      const pill = el('div','person');
      pill.appendChild(el('div','av', esc(ic)));
      pill.appendChild(el('span', null, `${esc(nm)}${role ? ` <small style="color:var(--text-dim);font-weight:600">${esc(role)}</small>` : ''}`));
      box.appendChild(pill);
    });
    p.appendChild(box);
    main.appendChild(p);
  }
  const info = STATE.data.info || [];
  if(info.length){
    const p = el('div','panel');
    p.appendChild(el('h2', null, 'ℹ️ 基本情報・おやくそく'));
    info.forEach(r => {
      const ks = allKeys(r);
      const k = r[ks[0]], v = ks.slice(1).map(x => r[x]).filter(Boolean).join(' / ');
      if(!k) return;
      const row = el('div','row');
      row.appendChild(el('div','k', `<b>${esc(k)}</b><span>${esc(v)}</span>`));
      p.appendChild(row);
    });
    main.appendChild(p);
  }
  // 上で個別に出したもの以外を、一覧としてまとめる
  const rest = extras.filter(([k, v]) => !RE_RULE.test(k) && !isPhone(k, v));
  if(rest.length){
    const p = el('div','panel');
    p.appendChild(el('h2', null, '📋 そのほか'));
    rest.forEach(([k,v]) => {
      const row = el('div','row');
      const isUrl = /^https?:\/\//i.test(v);
      const isTel = isPhone(k, v);
      const box = el('div','k');
      box.innerHTML = `<b>${esc(k)}</b><span>${
        isUrl ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`
        : isTel ? `<a href="tel:${esc(String(v).replace(/[^\d+]/g,''))}">${esc(v)}</a>`
        : esc(v)}</span>`;

      // 場所なら地図と経路へ、3列目にURLがあればホームページへ飛べるようにする
      const acts = el('div','acts');
      const add = (href, cls, label) => {
        const a = el('a','act' + (cls ? ' ' + cls : ''), label);
        a.href = href; a.target = '_blank'; a.rel = 'noopener';
        acts.appendChild(a);
      };
      if(isPlace(k, v)){
        const q = encodeURIComponent(placeQuery(v));
        add(`https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=transit`, 'primary', '🧭 ここへ行く');
        add(`https://www.google.com/maps/search/?api=1&query=${q}`, '', '🗺 地図');
      }
      const link = (STATE.data.settingLinks || {})[k];
      if(link) add(link, '', '🔗 ホームページ');
      if(acts.children.length) box.appendChild(acts);

      row.appendChild(box);
      p.appendChild(row);
    });
    main.appendChild(p);
  }
}

/* ------------------------------- 描画の入口 -------------------------------- */
function render(){
  $('#cover').classList.toggle('compact', STATE.tab !== 'plan');
  renderTabs();
  renderDayNav();
  ({
    plan: viewPlan, map: viewMap, pack: viewPack,
    money: viewMoney, book: viewBook, idea: viewIdea, info: viewInfo,
  }[STATE.tab] || viewPlan)();
  renderFoot();
}

function renderFoot(){
  const f = $('#foot');
  const at = STATE.data?.fetchedAt ? new Date(STATE.data.fetchedAt) : null;
  const stamp = at ? `${at.getMonth()+1}/${at.getDate()} ${String(at.getHours()).padStart(2,'0')}:${String(at.getMinutes()).padStart(2,'0')}` : '—';
  f.innerHTML = `${STATE.data?.offline ? '📴 オフライン表示中・' : ''}最終更新 ${stamp}<br>`;
  const b = el('button', null, '📊 スプレッドシートを開く');
  b.onclick = () => window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank');
  f.appendChild(b);
}

/* ------------------------------- 読み込み ---------------------------------- */
async function load(force){
  try{
    const sheets = await loadAllSheets();
    const itin = sheets.itinerary;
    if(!itin && !sheets.settings) throw new Error('シートを読めませんでした');

    // 「設定」は 項目 | 値 | リンク(任意) の3列まで読みます
    const settings = {}, settingLinks = {};
    (sheets.settings || []).forEach(r => {
      const ks = allKeys(r);
      const k = String(r[ks[0]]||'').trim();
      if(!k) return;
      settings[k] = String(r[ks[1]]||'').trim();
      const link = ks[2] ? String(r[ks[2]]||'').trim() : '';
      if(/^https?:\/\//i.test(link)) settingLinks[k] = link;
    });

    STATE.data = {
      days: buildItinerary(itin || []),
      settings, settingLinks,
      members:    sheets.members    || [],
      packing:    sheets.packing    || [],
      budget:     sheets.budget     || [],
      stay:       sheets.stay       || [],
      transport:  sheets.transport  || [],
      candidates: sheets.candidates || [],
      info:       sheets.info       || [],
      fetchedAt: Date.now(), offline:false,
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(STATE.data));
    if(force) toast('最新のしおりに更新しました');
  }catch(e){
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      STATE.data = JSON.parse(cached);
      STATE.data.days.forEach(d => d.items.forEach(i => { i.t = i.t || null; }));
      STATE.data.offline = true;
      toast('オフラインです。保存済みのしおりを表示します');
    }else{
      $('#main').innerHTML = '';
      $('#main').appendChild(el('div','empty',
        `<span class="big">😢</span>スプレッドシートを読み込めませんでした。<br><br>
         スプレッドシートの「共有」を<br><b>「リンクを知っている全員」→「閲覧者」</b><br>に設定してください。`));
      $('#tabs').innerHTML = '';
      return;
    }
  }
  // 今日が旅程に含まれていれば、その日を最初に開く
  const N = nowInfo();
  const todayIdx = STATE.data.days.findIndex(d => d.key === N.key);
  STATE.day = todayIdx >= 0 ? todayIdx : -1;
  renderCover();
  render();
}

$('#reload').onclick = async () => {
  const b = $('#reload');
  b.innerHTML = '<span class="spin">↻</span>';
  await load(true);
  b.innerHTML = '↻';
};

load(false);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
